<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background:#070a12; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Navigation Bar -->
  <rect x="0" y="0" width="900" height="60" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="15" width="30" height="30" rx="6" fill="#00ffcc" fill-opacity="0.1" stroke="#00ffcc" stroke-width="1.5"/>
  <path d="M40 22 L47 25 L47 31 C47 36 40 39 40 39 C40 39 33 36 33 31 L33 25 Z" fill="none" stroke="#00ffcc" stroke-width="1.5"/>
  <text x="65" y="32" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">CYBERSECURITY AUTH TOOLKIT</text>
  <text x="65" y="44" fill="#00ffcc" font-size="9" font-family="'JetBrains Mono', monospace">COLLEGE ASSIGNMENT PROTOTYPE</text>

  <rect x="740" y="16" width="135" height="28" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="754" cy="30" r="4" fill="#10b981"/>
  <text x="765" y="34" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">API: ONLINE</text>

  <!-- Card Background -->
  <rect x="230" y="85" width="440" height="445" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="230" y1="86" x2="670" y2="86" stroke="url(#cyanGrad)" stroke-width="2"/>

  <!-- Card Header -->
  <text x="260" y="125" fill="#ffffff" font-size="18" font-weight="700">User Registration</text>
  <text x="260" y="142" fill="#94a3b8" font-size="11">Enforcing password complexity &amp; salted bcrypt hashing</text>

  <!-- Input Fields -->
  <text x="260" y="175" fill="#94a3b8" font-size="10" font-weight="600">USERNAME</text>
  <rect x="260" y="183" width="380" height="34" rx="6" fill="#0b1120" stroke="#1e293b"/>
  <text x="280" y="205" fill="#ffffff" font-size="12">student_analyst</text>

  <text x="260" y="235" fill="#94a3b8" font-size="10" font-weight="600">EMAIL ADDRESS</text>
  <rect x="260" y="243" width="380" height="34" rx="6" fill="#0b1120" stroke="#1e293b"/>
  <text x="280" y="265" fill="#ffffff" font-size="12">analyst@university.edu</text>

  <text x="260" y="295" fill="#94a3b8" font-size="10" font-weight="600">PASSWORD</text>
  <rect x="260" y="303" width="380" height="34" rx="6" fill="#0b1120" stroke="#00ffcc" stroke-width="1.5"/>
  <text x="280" y="325" fill="#00ffcc" font-size="12" font-family="'JetBrains Mono', monospace">CyberSec@2026!</text>

  <!-- Strength Meter -->
  <rect x="260" y="348" width="380" height="110" rx="8" fill="#000000" fill-opacity="0.3" stroke="#1e293b"/>
  <text x="275" y="368" fill="#94a3b8" font-size="11">Password Strength:</text>
  <text x="510" y="368" fill="#10b981" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">Strong (Cyber-Compliant)</text>

  <!-- 4 Colored Bars -->
  <rect x="275" y="378" width="80" height="5" rx="2.5" fill="#10b981"/>
  <rect x="365" y="378" width="80" height="5" rx="2.5" fill="#10b981"/>
  <rect x="455" y="378" width="80" height="5" rx="2.5" fill="#10b981"/>
  <rect x="545" y="378" width="80" height="5" rx="2.5" fill="#10b981"/>

  <!-- Checklist items -->
  <text x="275" y="405" fill="#10b981" font-size="10">✓ At least 8 characters</text>
  <text x="450" y="405" fill="#10b981" font-size="10">✓ Uppercase letter (A-Z)</text>
  <text x="275" y="425" fill="#10b981" font-size="10">✓ Lowercase letter (a-z)</text>
  <text x="450" y="425" fill="#10b981" font-size="10">✓ Numeric digit (0-9)</text>
  <text x="275" y="445" fill="#10b981" font-size="10">✓ Special symbol (!@#$...)</text>

  <!-- Submit Button -->
  <rect x="260" y="475" width="380" height="38" rx="8" fill="#00ffcc"/>
  <text x="365" y="499" fill="#070a12" font-size="12" font-weight="700" letter-spacing="0.5">CREATE SECURE ACCOUNT</text>
</svg>
