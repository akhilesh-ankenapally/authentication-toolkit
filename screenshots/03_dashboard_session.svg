  <text x="75" y="196" fill="#94a3b8" font-size="11">Stored in MongoDB Single User Collection</text>

  <rect x="75" y="215" width="330" height="32" rx="6" fill="#0b1120" stroke="#1e293b"/>
  <text x="90" y="235" fill="#94a3b8" font-size="11">Username:</text>
  <text x="280" y="235" fill="#ffffff" font-size="11" font-family="'JetBrains Mono', monospace">student_analyst</text>

  <rect x="75" y="255" width="330" height="32" rx="6" fill="#0b1120" stroke="#1e293b"/>
  <text x="90" y="275" fill="#94a3b8" font-size="11">Email:</text>
  <text x="235" y="275" fill="#ffffff" font-size="11" font-family="'JetBrains Mono', monospace">analyst@univ.edu</text>

  <rect x="75" y="295" width="330" height="32" rx="6" fill="#0b1120" stroke="#1e293b"/>
  <text x="90" y="315" fill="#94a3b8" font-size="11">Password Hash:</text>
  <text x="250" y="315" fill="#10b981" font-size="11" font-family="'JetBrains Mono', monospace">bcrypt ($2b$10$...)</text>

  <!-- Right Card: Session Management -->
  <rect x="470" y="145" width="380" height="230" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="495" y="180" fill="#ffffff" font-size="16" font-weight="700">Session Management</text>
  <text x="495" y="196" fill="#94a3b8" font-size="11">JSON Web Token (JWT) Bearer Authentication</text>

  <text x="495" y="228" fill="#94a3b8" font-size="10">ACTIVE JWT TOKEN:</text>
  <rect x="495" y="235" width="330" height="52" rx="6" fill="#0b1120" stroke="#1e293b"/>
  <text x="505" y="255" fill="#00ffcc" font-size="9" font-family="'JetBrains Mono', monospace">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY2</text>
  <text x="505" y="272" fill="#00ffcc" font-size="9" font-family="'JetBrains Mono', monospace">ZTVmN2I...[Header.Payload.Signature]</text>

  <rect x="495" y="300" width="130" height="28" rx="6" fill="#1e293b"/>
  <text x="515" y="318" fill="#ffffff" font-size="11">✓ Token Verified</text>
