  <text x="75" y="450" fill="#00ffcc" font-size="11" font-weight="600">1. Password Validation:</text>
  <text x="215" y="450" fill="#94a3b8" font-size="11">Client &amp; Server regex enforcement (8+ chars, A-Z, 0-9, symbol)</text>

  <text x="75" y="475" fill="#00ffcc" font-size="11" font-weight="600">2. Salted Bcrypt Hashing:</text>
  <text x="240" y="475" fill="#94a3b8" font-size="11">10 cost rounds against precomputed rainbow table lookups</text>

  <text x="75" y="500" fill="#00ffcc" font-size="11" font-weight="600">3. Rate Limiting Control:</text>
  <text x="235" y="500" fill="#94a3b8" font-size="11">5-attempt IP throttling window mitigating brute-force attacks</text>
